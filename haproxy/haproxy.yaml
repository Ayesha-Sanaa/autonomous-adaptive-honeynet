apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy
          image: docker.io/library/haproxy@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
          ports:
            - containerPort: 2222
            - containerPort: 8080
            - containerPort: 2121
            - containerPort: 2323
            - containerPort: 4445
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy
  namespace: honeynet
spec:
  type: NodePort
  selector:
    app: haproxy
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
      nodePort: 30222
    - name: web
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: ftp
      port: 2121
      targetPort: 2121
      nodePort: 30121
    - name: telnet
      port: 2323
      targetPort: 2323
      nodePort: 30123
    - name: smb
      port: 4445
      targetPort: 4445
      nodePort: 30445
