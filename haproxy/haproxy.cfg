global
  log stdout format raw local0

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 4m
  timeout server 4m

frontend ssh_in
  bind *:2222
  stick-table type ip size 100k expire 10m store conn_rate(10s),conn_cur
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc_conn_rate(0) gt 60 } or { sc_conn_cur(0) gt 50 }
  default_backend cowrie_pool
backend cowrie_pool
  server cowrie cowrie:2222

frontend web_in
  bind *:8080
  stick-table type ip size 100k expire 10m store conn_rate(10s),conn_cur
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc_conn_rate(0) gt 60 } or { sc_conn_cur(0) gt 50 }
  default_backend web_pool
backend web_pool
  server web web-portal:80

