global
  log stdout format raw local0

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 5m
  timeout server 5m

frontend ssh_in
  bind *:2222
  default_backend cowrie_pool
backend cowrie_pool
  server cowrie cowrie:2222

frontend web_in
  bind *:8080
  default_backend web_pool
backend web_pool
  server web web-portal:80

frontend ftp_in
  bind *:2121
  default_backend ftp_pool
backend ftp_pool
  server heralding heralding:21

frontend telnet_in
  bind *:2323
  default_backend telnet_pool
backend telnet_pool
  server heralding heralding:23

frontend smb_in
  bind *:4445
  default_backend smb_pool
backend smb_pool
  server dionaea dionaea:445
