apiVersion: apps/v1
kind: Deployment
metadata:
  name: dionaea
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dionaea
  template:
    metadata:
      labels:
        app: dionaea
    spec:
      containers:
        - name: dionaea
          image: dinotools/dionaea:nightly
          env:
            - name: DIONAEA_FORCE_INIT_CONF
              value: "1"
          ports:
            - containerPort: 445
          volumeMounts:
            - name: log-json
              mountPath: /opt/dionaea/etc/dionaea/ihandlers-enabled/log_json.yaml
              subPath: log_json.yaml
            - name: lib
              mountPath: /opt/dionaea/var/lib
        - name: crdt
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "crdt-sidecar.js"]
          env:
            - name: DECOY_NAME
              value: dionaea
            - name: PORT
              value: "7000"
            - name: LOG_FILE
              value: /logs/dionaea/lib/dionaea/dionaea.json
            - name: LOG_FORMAT
              value: jsonl
            - name: NORMALIZER
              value: dionaea
            - name: PEERS
              value: http://cowrie-crdt:7000,http://web-portal-crdt:7000,http://heralding-crdt:7000
          ports:
            - containerPort: 7000
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: alllogs
              mountPath: /logs
              readOnly: true
      volumes:
        - name: log-json
          configMap:
            name: dionaea-log-json
        - name: lib
          hostPath:
            path: /logs/dionaea/lib
            type: Directory
        - name: log
          hostPath:
            path: /logs/dionaea/log
            type: Directory
        - name: alllogs
          hostPath:
            path: /logs
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: dionaea
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: dionaea
  ports:
    - port: 445
      targetPort: 445
