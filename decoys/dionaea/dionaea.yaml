apiVersion: apps/v1
kind: Deployment
metadata:
  name: dionaea
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dionaea
  template:
    metadata:
      labels:
        app: dionaea
    spec:
      containers:
        - name: dionaea
          image: docker.io/dinotools/dionaea@sha256:247ad0c2deff460c41ebd2e6bdf70d5b4322048cef72cd60ab68c98c23cea906
          env:
            - name: DIONAEA_FORCE_INIT_CONF
              value: "1"
          ports:
            - containerPort: 445
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: 445
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 445
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: log-json
              mountPath: /opt/dionaea/etc/dionaea/ihandlers-enabled/log_json.yaml
              subPath: log_json.yaml
            - name: lib
              mountPath: /opt/dionaea/var/lib
        - name: crdt
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "crdt-sidecar.js"]
          env:
            - name: DECOY_NAME
              value: dionaea
            - name: PORT
              value: "7000"
            - name: LOG_FILE
              value: /logs/dionaea/lib/dionaea/dionaea.json
            - name: LOG_FORMAT
              value: jsonl
            - name: NORMALIZER
              value: dionaea
            - name: PEERS
              value: http://cowrie-crdt:7000,http://web-portal-crdt:7000,http://heralding-crdt:7000
            - name: STATE_FILE
              value: /crdt-state/dionaea.json
            - name: CRDT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: honeynet-secrets
                  key: crdt-token
                  optional: false
          ports:
            - containerPort: 7000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: alllogs
              mountPath: /logs
              readOnly: true
            - name: crdt-state
              mountPath: /crdt-state
      volumes:
        - name: log-json
          configMap:
            name: dionaea-log-json
        - name: lib
          hostPath:
            path: /logs/dionaea/lib
            type: Directory
        - name: log
          hostPath:
            path: /logs/dionaea/log
            type: Directory
        - name: alllogs
          hostPath:
            path: /logs
            type: Directory
        - name: crdt-state
          hostPath:
            path: /logs/crdt-state
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: dionaea
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: dionaea
  ports:
    - port: 445
      targetPort: 445
