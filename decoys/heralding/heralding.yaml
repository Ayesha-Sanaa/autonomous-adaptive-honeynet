apiVersion: apps/v1
kind: Deployment
metadata:
  name: heralding
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heralding
  template:
    metadata:
      labels:
        app: heralding
    spec:
      containers:
        - name: heralding
          image: dtagdevsec/heralding:24.04.1
          ports:
            - containerPort: 21
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 21
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 21
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp/heralding
            - name: logs
              mountPath: /var/log/heralding
        - name: crdt
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "crdt-sidecar.js"]
          env:
            - name: DECOY_NAME
              value: heralding
            - name: PORT
              value: "7000"
            - name: LOG_FILE
              value: /logs/heralding/auth.csv
            - name: LOG_FORMAT
              value: csv
            - name: NORMALIZER
              value: heralding
            - name: PEERS
              value: http://cowrie-crdt:7000,http://web-portal-crdt:7000,http://dionaea-crdt:7000
            - name: STATE_FILE
              value: /crdt-state/heralding.json
            - name: CRDT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: honeynet-secrets
                  key: crdt-token
                  optional: true
          ports:
            - containerPort: 7000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: alllogs
              mountPath: /logs
              readOnly: true
            - name: crdt-state
              mountPath: /crdt-state
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          hostPath:
            path: /logs/heralding
            type: Directory
        - name: alllogs
          hostPath:
            path: /logs
            type: Directory
        - name: crdt-state
          hostPath:
            path: /logs/crdt-state
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: heralding
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: heralding
  ports:
    - name: ftp
      port: 21
      targetPort: 21
    - name: telnet
      port: 23
      targetPort: 23
