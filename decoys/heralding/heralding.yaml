apiVersion: apps/v1
kind: Deployment
metadata:
  name: heralding
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heralding
  template:
    metadata:
      labels:
        app: heralding
    spec:
      containers:
        - name: heralding
          image: dtagdevsec/heralding:24.04.1
          ports:
            - containerPort: 21
            - containerPort: 23
          volumeMounts:
            - name: tmp
              mountPath: /tmp/heralding
            - name: logs
              mountPath: /var/log/heralding
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          hostPath:
            path: /logs/heralding
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: heralding
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: heralding
  ports:
    - name: ftp
      port: 21
      targetPort: 21
    - name: telnet
      port: 23
      targetPort: 23
