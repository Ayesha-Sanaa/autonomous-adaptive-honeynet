apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cowrie
  template:
    metadata:
      labels:
        app: cowrie
    spec:
      initContainers:
        - name: build-fs
          image: cowrie/cowrie:latest
          command: ["python3", "/scripts/build-fs.py"]
          volumeMounts:
            - name: fs
              mountPath: /fs
            - name: fs-builder
              mountPath: /scripts
              readOnly: true
      containers:
        - name: cowrie
          image: cowrie/cowrie:latest
          env:
            - name: COWRIE_SHELL_FILESYSTEM
              value: /fs/custom-fs.pickle
          ports:
            - containerPort: 2222
          volumeMounts:
            - name: logs
              mountPath: /cowrie/cowrie-git/var/log/cowrie
            - name: userdb
              mountPath: /cowrie/cowrie-git/etc/userdb.txt
              subPath: userdb.txt
              readOnly: true
            - name: fs
              mountPath: /fs
              readOnly: true
        - name: crdt
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "crdt-sidecar.js"]
          env:
            - name: DECOY_NAME
              value: cowrie
            - name: PORT
              value: "7000"
            - name: LOG_FILE
              value: /logs/cowrie/cowrie.json
            - name: LOG_FORMAT
              value: jsonl
            - name: NORMALIZER
              value: cowrie
            - name: PEERS
              value: http://web-portal-crdt:7000,http://heralding-crdt:7000,http://dionaea-crdt:7000
          ports:
            - containerPort: 7000
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: alllogs
              mountPath: /logs
              readOnly: true
      volumes:
        - name: logs
          hostPath:
            path: /logs/cowrie
            type: Directory
        - name: alllogs
          hostPath:
            path: /logs
            type: Directory
        - name: userdb
          configMap:
            name: cowrie-userdb
        - name: fs
          emptyDir: {}
        - name: fs-builder
          configMap:
            name: cowrie-fs-builder
---
apiVersion: v1
kind: Service
metadata:
  name: cowrie
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: cowrie
  ports:
    - port: 2222
      targetPort: 2222





