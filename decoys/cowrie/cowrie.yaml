apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cowrie
  template:
    metadata:
      labels:
        app: cowrie
    spec:
      initContainers:
        - name: build-fs
          image: docker.io/cowrie/cowrie@sha256:115ed9b682dce64a112d6185dcd64c94969599e5b63f13c3e85927a9b2f0292f
          command: ["python3", "/scripts/build-fs.py"]
          volumeMounts:
            - name: fs
              mountPath: /fs
            - name: fs-builder
              mountPath: /scripts
              readOnly: true
            - name: honeytokens
              mountPath: /tokens/honeytokens.json
              subPath: honeytokens.json
              readOnly: true
      containers:
        - name: cowrie
          image: docker.io/cowrie/cowrie@sha256:115ed9b682dce64a112d6185dcd64c94969599e5b63f13c3e85927a9b2f0292f
          env:
            - name: COWRIE_SHELL_FILESYSTEM
              value: /fs/custom-fs.pickle
            - name: COWRIE_SHELL_HOSTNAME
              value: jump01
            - name: COWRIE_SHELL_KERNEL_VERSION
              value: 6.1.0-26-amd64
            - name: COWRIE_SHELL_KERNEL_BUILD_STRING
              value: "#1 SMP PREEMPT_DYNAMIC Debian 6.1.112-1 (2024-09-30)"
            - name: COWRIE_SHELL_HARDWARE_PLATFORM
              value: x86_64
            - name: COWRIE_SHELL_OPERATING_SYSTEM
              value: GNU/Linux
            - name: COWRIE_SSH_VERSION
              value: "SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3"
            - name: ACTIONS_DIR
              value: /actions
          ports:
            - containerPort: 2222
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: logs
              mountPath: /cowrie/cowrie-git/var/log/cowrie
            - name: userdb
              mountPath: /cowrie/cowrie-git/etc/userdb.txt
              subPath: userdb.txt
              readOnly: true
            - name: fs
              mountPath: /fs
              readOnly: true
            - name: actions
              mountPath: /actions
              readOnly: true
            - name: cmdoutput
              mountPath: /cowrie/cowrie-git/src/cowrie/data/cmdoutput.json
              subPath: cmdoutput.json
              readOnly: true
        - name: actuator
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "/app/cowrie-actuator.js"]
          env:
            - name: ACTUATOR_PORT
              value: "7100"
            - name: ACTIONS_DIR
              value: /actions
          ports:
            - containerPort: 7100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 7100
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: actions
              mountPath: /actions
        - name: crdt
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "crdt-sidecar.js"]
          env:
            - name: DECOY_NAME
              value: cowrie
            - name: PORT
              value: "7000"
            - name: LOG_FILE
              value: /logs/cowrie/cowrie.json
            - name: LOG_FORMAT
              value: jsonl
            - name: NORMALIZER
              value: cowrie
            - name: PEERS
              value: http://web-portal-crdt:7000,http://heralding-crdt:7000,http://dionaea-crdt:7000
            - name: STATE_FILE
              value: /crdt-state/cowrie.json
            - name: CRDT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: honeynet-secrets
                  key: crdt-token
                  optional: true
          ports:
            - containerPort: 7000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: alllogs
              mountPath: /logs
              readOnly: true
            - name: crdt-state
              mountPath: /crdt-state
      volumes:
        - name: logs
          hostPath:
            path: /logs/cowrie
            type: Directory
        - name: alllogs
          hostPath:
            path: /logs
            type: Directory
        - name: crdt-state
          hostPath:
            path: /logs/crdt-state
            type: DirectoryOrCreate
        - name: userdb
          configMap:
            name: cowrie-userdb
        - name: fs
          emptyDir: {}
        - name: actions
          emptyDir: {}
        - name: fs-builder
          configMap:
            name: cowrie-fs-builder
        - name: honeytokens
          configMap:
            name: honeytokens-json
        - name: cmdoutput
          configMap:
            name: cowrie-cmdoutput
---
apiVersion: v1
kind: Service
metadata:
  name: cowrie
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: cowrie
  ports:
    - port: 2222
      targetPort: 2222
---
apiVersion: v1
kind: Service
metadata:
  name: cowrie-actuator
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: cowrie
  ports:
    - name: http
      port: 7100
      targetPort: 7100
