apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx@sha256:b2f80f8f88146b0772fdcc7d92cea621aa8c2889fa8d07ed61d4884fcea53e09
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
        - name: crdt
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "crdt-sidecar.js"]
          env:
            - name: DECOY_NAME
              value: web-portal
            - name: PORT
              value: "7000"
            - name: LOG_FILE
              value: /logs/web-portal/web.json
            - name: LOG_FORMAT
              value: jsonl
            - name: NORMALIZER
              value: web-portal
            - name: PEERS
              value: http://cowrie-crdt:7000,http://heralding-crdt:7000,http://dionaea-crdt:7000
            - name: STATE_FILE
              value: /crdt-state/web-portal.json
            - name: CRDT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: honeynet-secrets
                  key: crdt-token
                  optional: false
          ports:
            - containerPort: 7000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: alllogs
              mountPath: /logs
              readOnly: true
            - name: crdt-state
              mountPath: /crdt-state
      volumes:
        - name: html
          configMap:
            name: portal-html
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: alllogs
          hostPath:
            path: /logs
            type: Directory
        - name: crdt-state
          hostPath:
            path: /logs/crdt-state
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: web-portal
  ports:
    - port: 80
      targetPort: 80
