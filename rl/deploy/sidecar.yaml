apiVersion: apps/v1
kind: Deployment
metadata:
  name: rl-sidecar
  namespace: honeynet
  labels:
    app: rl-sidecar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rl-sidecar
  template:
    metadata:
      labels:
        app: rl-sidecar
    spec:
      containers:
        - name: sidecar
          image: honeynet-rl:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MODEL_PATH
              value: "ppo_honeynet.onnx"
            - name: FEATURES_PATH
              value: "features.json"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rl-sidecar
  namespace: honeynet
spec:
  type: ClusterIP
  selector:
    app: rl-sidecar
  ports:
    - name: http
      port: 5000
      targetPort: 5000
