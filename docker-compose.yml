services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    ports:
      - "2222:2222"
    volumes:
      - ./logs:/cowrie/cowrie-git/var/log/cowrie
    restart: unless-stopped

  backend:
    image: node:alpine
    container_name: backend
    working_dir: /app
    command: node server.js
    volumes:
      - ./decoys/web-portal/capture:/app:ro
      - ./logs:/logs
    restart: unless-stopped

  web-portal:
    image: nginx:alpine
    container_name: web-portal
    ports:
      - "8080:80"
    volumes:
      - ./decoys/web-portal/site:/usr/share/nginx/html:ro
      - ./decoys/web-portal/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  heralding:
    image: dtagdevsec/heralding:24.04.1
    container_name: heralding
    ports:
      - "2121:21"
      - "2323:23"
    tmpfs:
      - /tmp/heralding:uid=2000,gid=2000 
    volumes:
      - ./logs/heralding:/var/log/heralding     
    restart: unless-stopped

  dionaea:
    image: dinotools/dionaea:nightly
    container_name: dionaea
    ports:
      - "4445:445"
    volumes:
      - ./dionaea/etc:/opt/dionaea/etc
      - ./dionaea/lib:/opt/dionaea/var/lib
      - ./dionaea/log:/opt/dionaea/var/log
    restart: unless-stopped    