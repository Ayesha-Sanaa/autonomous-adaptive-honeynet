# Example ONLY — never commit real secrets to Git.
# Create the real secret in your cluster using kubectl create secret generic:
#   kubectl -n honeynet create secret generic honeynet-secrets \
#     --from-literal=mongo-url='mongodb://honeynet_app:<STRONG_PASSWORD>@mongodb:27017/honeynet?authSource=admin' \
#     --from-literal=crdt-token='<RANDOM_HEX_TOKEN>' \
#     --from-literal=mariadb-root-password='<STRONG_PASSWORD>'
apiVersion: v1
kind: Secret
metadata:
  name: honeynet-secrets
  namespace: honeynet
type: Opaque
stringData:
  mongo-url: "mongodb://mongodb:27017/honeynet"
  crdt-token: "REPLACE_WITH_RANDOM_TOKEN"
  mariadb-root-password: "REPLACE_WITH_RANDOM_PASSWORD"
