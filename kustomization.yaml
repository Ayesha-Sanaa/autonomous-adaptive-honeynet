resources:
  - k8s/namespace.yaml
  - decoys/cowrie/cowrie.yaml
  - decoys/web-portal/capture.yaml
  - decoys/web-portal/web-portal.yaml
  - decoys/heralding/heralding.yaml
  - decoys/dionaea/dionaea.yaml
  - backend/deploy/mongodb.yaml
  - backend/deploy/collector.yaml
  - backend/deploy/api.yaml
  - rl/deploy/sidecar.yaml
  - haproxy/haproxy.yaml
  - decoys/crdt-services.yaml
configMapGenerator:
  - name: backend-code
    namespace: honeynet
    files:
     - decoys/web-portal/capture/server.js
  - name: portal-html
    namespace: honeynet
    files:
     - decoys/web-portal/site/index.html
  - name: nginx-conf
    namespace: honeynet
    files:
     - decoys/web-portal/nginx/default.conf

  - name: dionaea-log-json
    namespace: honeynet
    files:
     - decoys/dionaea/log_json.yaml   

  - name: cowrie-userdb
    namespace: honeynet
    files:
      - userdb.txt=decoys/cowrie/userdb.txt
      
  - name: cowrie-fs-builder
    namespace: honeynet
    files:
      - build-fs.py=decoys/cowrie/build-fs.py    

  - name: haproxy-config
    namespace: honeynet
    files:
      - haproxy/haproxy.cfg   