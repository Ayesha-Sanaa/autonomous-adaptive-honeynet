  - k8s/decoys/cowrie.yaml
  - k8s/decoys/backend.yaml
  - k8s/decoys/web-portal.yaml
  - k8s/decoys/heralding.yaml
  - k8s/decoys/dionaea.yaml
configMapGenerator:
  - name: backend-code
    namespace: honeynet
    files:
     - decoys/web-portal/capture/server.js
