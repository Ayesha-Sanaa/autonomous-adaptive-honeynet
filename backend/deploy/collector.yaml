apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "collector.js"]
          env:
            - name: MONGO_URL
              value: mongodb://mongodb:27017
            - name: SIDECAR_URL
              value: http://rl-sidecar:5000
            - name: ACTUATOR_URL
              value: http://cowrie-actuator:7100
            - name: LIVE_ACTIONS
              value: "1"
          volumeMounts:
            - name: logs
              mountPath: /logs
              readOnly: true
      volumes:
        - name: logs
          hostPath:
            path: /logs
            type: Directory