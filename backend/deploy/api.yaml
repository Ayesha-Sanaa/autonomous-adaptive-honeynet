apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "api.js"]
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_URL
              value: mongodb://mongodb:27017
            - name: SIDECAR_URL
              value: http://rl-sidecar:5000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: honeynet
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001