apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: honeynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: honeynet-backend:dev
          imagePullPolicy: Never
          command: ["node", "api.js"]
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: honeynet-secrets
                  key: mongo-url
                  optional: false
            - name: SIDECAR_URL
              value: http://rl-sidecar:5000
            - name: CRDT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: honeynet-secrets
                  key: crdt-token
                  optional: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: honeynet
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001